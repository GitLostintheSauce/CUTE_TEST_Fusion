[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cute-pipeline"
version = "0.1.0"
description = "CUTE tokamak magnetic diagnostic pipeline and equilibrium reconstruction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pydantic>=2.0",
    "plotly>=5.14",
    "dash>=2.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[project.scripts]
cute-reconstruct = "src.reconstruct.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
