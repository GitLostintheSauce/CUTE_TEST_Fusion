name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tarball unpacks to a versioned folder name, so rename it to the
      # path used below, and point the library path at bin/, where the
      # tarball keeps its libraries. The CUTE mesh is not committed (*.h5 is
      # ignored), so fetch the identical copy from the same OFT release.
      # v26.9 rather than v1.0.0-beta7: the beta7 Linux build returned
      # all-zero TokaMaker fields at random in about 60% of CI jobs.
      - name: Install OFT
        run: |
          curl -sL "https://github.com/OpenFUSIONToolkit/OpenFUSIONToolkit/releases/download/v26.9/OpenFUSIONToolkit_v26.9-Linux-GNU-x86_64.tar.gz" | tar xz -C /tmp
          mv /tmp/OpenFUSIONToolkit_v26.9-Linux-GNU-x86_64 /tmp/OpenFUSIONToolkit
          curl -sfL -o data/CUTE_mesh.h5 "https://raw.githubusercontent.com/OpenFUSIONToolkit/OpenFUSIONToolkit/v26.9/src/examples/TokaMaker/CUTE/CUTE_mesh.h5"
          echo "OFT_PATH=/tmp/OpenFUSIONToolkit" >> $GITHUB_ENV
          echo "PYTHONPATH=/tmp/OpenFUSIONToolkit/python:$PYTHONPATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/OpenFUSIONToolkit/bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "/tmp/OpenFUSIONToolkit/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff lint
        run: ruff check src/ tests/

      - name: mypy type check
        run: mypy src/

      # --cov-fail-under keeps the README coverage badge honest: if coverage
      # drops meaningfully below the advertised number, CI fails.
      - name: pytest
        run: pytest tests/ --tb=short --cov=src --cov-report=term --cov-fail-under=50
        env:
          PYTHONPATH: "/tmp/OpenFUSIONToolkit/python:${{ github.workspace }}"
